<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Get-star.com</title>
</head>
<style>
  *{
    margin: 0;
    padding: 0;
    font-family:'poppins',sans-serif;
  }
  body{
     background-image:linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0,0 , 0.75)),url(budgeting.jpeg);
     background-size:cover ;
    
  }
  .text{
    font-size: 50px;
    font-weight: 600;
    color: #fff;
  }
  .main-text .Dot{
    color: #E52E2E;
  }
  .text-container{
    margin: 20px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  .motto{
    font-size: 20px;
    position: relative;
    top:290px;
    color: #fff;
    width: 310px;
    font-weight: 500;
  }
  .button-container{
    position: relative;
    top: 310px;
  }
  .button{
    padding: 10px 18px;
    font-weight: 600;
    border: 2px solid #fff;
    border-radius: 30px;
    background: transparent;
    color: #fff;
  }
  .button:hover{
   border: none;
   color: #070707;
   
  }
  .button:hover span{
    width: 100%;
  }
  .some{
     
  background:#fff ;
  height:100% ;
  width: 0;
  border-radius: 25px;
  left: 0;
  bottom: 0;
  z-index: -1;
  position: absolute;
  transition: 0.5s;
}
</style>
<body>
  <div class="text-container">
    <div class="main-text">
    <p class="text">pirance<span class="Dot">.</span></p>
    </div>
    <div>
      <p class="motto">Manage your  finances , track your expenses , create your budget and Manage your spending habits</p>
    </div>
    <div class="button-container">
      <button class="button"><span class="some"></span>GET STARTED</button>
    </div>
  </div>
  <script>
    document.querySelector('.button').
    addEventListener('click',() => {
    window.location.href='pirance.html';
    });
  </script>
</body>
</html>
